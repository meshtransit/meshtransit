name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify module checksums
        run: go mod verify

      - name: Verify module metadata is tidy
        shell: bash
        run: |
          go mod tidy
          changes="$(git status --porcelain -- go.mod go.sum)"
          if [[ -n "${changes}" ]]; then
            printf '%s\n' "${changes}"
            exit 1
          fi

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            printf '%s\n' "${unformatted}"
            exit 1
          fi

      - name: Validate Linux qualification harness
        run: |
          bash -n \
            tools/qualification/linux-restart.sh \
            tools/qualification/test-linux-restart.sh \
            tools/qualification/linux-reboot.sh \
            tools/qualification/test-linux-reboot.sh \
            tools/qualification/linux-network-change.sh \
            tools/qualification/test-linux-network-change.sh \
            tools/qualification/linux-relay-fallback.sh \
            tools/qualification/test-linux-relay-fallback.sh \
            tools/qualification/testdata/ping
          shellcheck \
            tools/qualification/linux-restart.sh \
            tools/qualification/test-linux-restart.sh \
            tools/qualification/linux-reboot.sh \
            tools/qualification/test-linux-reboot.sh \
            tools/qualification/linux-network-change.sh \
            tools/qualification/test-linux-network-change.sh \
            tools/qualification/linux-relay-fallback.sh \
            tools/qualification/test-linux-relay-fallback.sh \
            tools/qualification/testdata/ping
          bash tools/qualification/test-linux-restart.sh
          bash tools/qualification/test-linux-reboot.sh
          bash tools/qualification/test-linux-network-change.sh
          bash tools/qualification/test-linux-relay-fallback.sh

      - name: Run vet
        run: go vet ./...

      - name: Run tests with race detection
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Install govulncheck
        env:
          GOBIN: ${{ runner.temp }}/mesh-tools
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Scan reachable vulnerabilities
        run: ${{ runner.temp }}/mesh-tools/govulncheck ./...

  cross-build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
          - target: linux-arm64
            goos: linux
            goarch: arm64
          - target: windows-amd64
            goos: windows
            goarch: amd64
          - target: macos-arm64
            goos: darwin
            goarch: arm64
          - target: macos-amd64
            goos: darwin
            goarch: amd64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Compile target
        env:
          CGO_ENABLED: "0"
          GOTOOLCHAIN: local
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath ./...

  linux-package:
    name: Package Linux (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Validate packaging scripts
        run: |
          bash -n packaging/linux/build-deb.sh packaging/linux/verify-deb.sh packaging/linux/test-maintainer-scripts.sh
          dash -n packaging/linux/test-package-maintainers.sh packaging/linux/deb/*
          shellcheck packaging/linux/build-deb.sh packaging/linux/verify-deb.sh packaging/linux/test-maintainer-scripts.sh packaging/linux/test-package-maintainers.sh packaging/linux/deb/*

      - name: Test package maintainer lifecycle
        run: bash packaging/linux/test-maintainer-scripts.sh

      - name: Build and inspect package
        run: |
          bash packaging/linux/build-deb.sh "0.1.0~ci.${GITHUB_RUN_NUMBER}" "${{ matrix.arch }}" dist
          bash packaging/linux/verify-deb.sh "dist/meshd_0.1.0~ci.${GITHUB_RUN_NUMBER}_${{ matrix.arch }}.deb" "${{ matrix.arch }}"

      - name: Test packaged maintainer lifecycle
        run: |
          docker run --rm \
            --volume "${PWD}:/src:ro" \
            --workdir /src \
            debian:trixie-slim@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132 \
            /src/packaging/linux/test-package-maintainers.sh \
            "/src/dist/meshd_0.1.0~ci.${GITHUB_RUN_NUMBER}_${{ matrix.arch }}.deb"
