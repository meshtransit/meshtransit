name: Relay

# No paths filter: relay builds on shared/ and the root module, and the job is
# short, so it runs on every change.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

concurrency:
  group: relay-${{ github.workflow }}-${{ github.ref }}
  # Keep every run on main so each merge gets its own result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Quality (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l relay)"
          if [[ -n "${unformatted}" ]]; then
            printf '%s\n' "${unformatted}"
            exit 1
          fi

      - name: Run vet
        run: go vet ./relay/...

      - name: Run tests with race detection
        run: go test -race -shuffle=on ./relay/...

      # Same linter version and config as the local gate.
      - name: Run golangci-lint
        run: make lint-relay

      - name: Check licence boundaries
        run: bash hack/check-import-boundaries.sh

      - name: Build container image
        run: docker build --file relay/Dockerfile --tag meshrelay:ci .
