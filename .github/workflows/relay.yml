name: Relay

on:
  pull_request:
    paths:
      - "relay/**"
      - "shared/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/relay.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

concurrency:
  group: relay-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l relay)"
          if [[ -n "${unformatted}" ]]; then
            printf '%s\n' "${unformatted}"
            exit 1
          fi

      - name: Run vet
        run: go vet ./relay/...

      - name: Run tests with race detection
        run: go test -race -shuffle=on ./relay/...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m --config relay/.golangci.yml ./relay/...

      - name: Check licence boundaries
        run: bash hack/check-import-boundaries.sh

      - name: Build container image
        run: docker build --file relay/Dockerfile --tag meshrelay:ci .
