name: Client

# No paths filter: the client builds on shared/, api/ and the root module,
# and packaging and hack scripts feed these jobs, so it runs on every change.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

concurrency:
  group: client-${{ github.workflow }}-${{ github.ref }}
  # Keep every run on main so each merge gets its own result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Quality (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Gitleaks
        env:
          GOBIN: ${{ runner.temp }}/mesh-tools
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          printf '%s\n' "${GOBIN}" >>"${GITHUB_PATH}"

      - name: Scan history and working tree for secrets
        run: bash hack/security/scan-secrets.sh

      - name: Verify module checksums
        run: go mod verify

      - name: Verify module metadata is tidy
        shell: bash
        run: |
          go mod tidy
          changes="$(git status --porcelain -- go.mod go.sum)"
          if [[ -n "${changes}" ]]; then
            printf '%s\n' "${changes}"
            exit 1
          fi

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l client shared test)"
          if [[ -n "${unformatted}" ]]; then
            printf '%s\n' "${unformatted}"
            exit 1
          fi

      # Globs, not a list, so a new harness script cannot be left out.
      - name: Validate Linux qualification harness
        shell: bash
        run: |
          shopt -s failglob
          scripts=(client/tools/qualification/*.sh client/tools/qualification/testdata/ping)
          bash -n "${scripts[@]}"
          shellcheck "${scripts[@]}"
          PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/pycache" \
            python3 -m py_compile client/tools/qualification/testdata/policy_peer.py
          for test_script in client/tools/qualification/test-*.sh; do
            printf '== %s\n' "${test_script}"
            bash "${test_script}"
          done

      - name: Run vet
        run: go vet ./client/... ./shared/... ./test/...

      - name: Run tests with race detection
        run: go test -race -shuffle=on -coverprofile=coverage.out ./client/... ./shared/... ./test/...

      # Same linter version and config as the local gate.
      - name: Run golangci-lint
        run: make lint-client

      - name: Install govulncheck
        env:
          GOBIN: ${{ runner.temp }}/mesh-tools
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Scan reachable vulnerabilities
        run: ${{ runner.temp }}/mesh-tools/govulncheck ./client/...

  linux-container-tests:
    name: Linux container tests (make test-linux-client)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The container runs with GOPROXY=off on a read-only module cache.
      - name: Download modules
        run: go mod download

      - name: Run client tests in the pinned Linux Go image
        run: make test-linux-client

  subnet-router-e2e:
    name: Subnet router end to end (make e2e-subnet-router)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The container runs with GOPROXY=off on a read-only module cache.
      - name: Download modules
        run: go mod download

      - name: Route through a subnet router in network namespaces
        run: |
          set -o pipefail
          make e2e-subnet-router 2>&1 | tee "$RUNNER_TEMP/e2e.log"

      # Job logs need a signed-in reader; annotations do not.
      - name: Report the end of the log as an annotation
        if: failure()
        run: |
          tail -n 120 "$RUNNER_TEMP/e2e.log" | python3 -c 'import sys; text = sys.stdin.read().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"); print("::error title=Subnet router end to end::" + text)'

      - name: Keep the throughput and latency measurement
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: subnet-router-bench
          path: dist/subnet-router-bench.json
          if-no-files-found: ignore

  cross-build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
          - target: linux-arm64
            goos: linux
            goarch: arm64
          - target: windows-amd64
            goos: windows
            goarch: amd64
            lint: true
          - target: macos-arm64
            goos: darwin
            goarch: arm64
            lint: true
          - target: macos-amd64
            goos: darwin
            goarch: amd64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Compile target
        env:
          CGO_ENABLED: "0"
          GOTOOLCHAIN: local
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath ./client/...

      # Vet compiles the tests too, so a test that does not build for the
      # target fails here.
      - name: Vet target
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go vet ./client/... ./shared/... ./test/...

      # Linux is linted natively by the quality job.
      - name: Lint target
        if: ${{ matrix.lint }}
        env:
          LINT_GOOS: ${{ matrix.goos }}
          LINT_GOARCH: ${{ matrix.goarch }}
        run: make lint-client-cross

  linux-package:
    name: Package Linux (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Validate packaging scripts
        run: |
          bash -n \
            packaging/linux/meshd/build-deb.sh \
            packaging/linux/meshd/verify-deb.sh \
            packaging/linux/meshd/test-maintainer-scripts.sh \
            hack/security/audit-release-binary.sh \
            hack/security/test-audit-release-binary.sh \
            hack/security/install-supply-chain-tools.sh \
            hack/security/audit-linux-package.sh
          dash -n packaging/linux/meshd/test-package-maintainers.sh packaging/linux/meshd/deb/*
          shellcheck \
            packaging/linux/meshd/build-deb.sh \
            packaging/linux/meshd/verify-deb.sh \
            packaging/linux/meshd/test-maintainer-scripts.sh \
            packaging/linux/meshd/test-package-maintainers.sh \
            packaging/linux/meshd/deb/* \
            hack/security/audit-release-binary.sh \
            hack/security/test-audit-release-binary.sh \
            hack/security/install-supply-chain-tools.sh \
            hack/security/audit-linux-package.sh

      - name: Install pinned supply-chain tools
        run: |
          bash hack/security/install-supply-chain-tools.sh "${RUNNER_TEMP}/mesh-tools"
          printf '%s\n' "${RUNNER_TEMP}/mesh-tools" >>"${GITHUB_PATH}"

      - name: Test package maintainer lifecycle
        run: |
          bash packaging/linux/meshd/test-maintainer-scripts.sh
          bash hack/security/test-audit-release-binary.sh

      - name: Build and inspect package
        run: |
          bash packaging/linux/meshd/build-deb.sh "0.1.0~ci.${GITHUB_RUN_NUMBER}" "${{ matrix.arch }}" dist
          bash packaging/linux/meshd/verify-deb.sh "dist/meshd_0.1.0~ci.${GITHUB_RUN_NUMBER}_${{ matrix.arch }}.deb" "${{ matrix.arch }}"

      - name: Generate SBOM and scan packaged binaries
        run: bash hack/security/audit-linux-package.sh "dist/meshd_0.1.0~ci.${GITHUB_RUN_NUMBER}_${{ matrix.arch }}.deb"

      - name: Test packaged maintainer lifecycle
        run: |
          docker run --rm \
            --volume "${PWD}:/src:ro" \
            --workdir /src \
            debian:trixie-slim@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132 \
            /src/packaging/linux/meshd/test-package-maintainers.sh \
            "/src/dist/meshd_0.1.0~ci.${GITHUB_RUN_NUMBER}_${{ matrix.arch }}.deb"

      - name: Retain package security evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meshd-linux-${{ matrix.arch }}
          path: |
            dist/meshd_0.1.0~ci.${{ github.run_number }}_${{ matrix.arch }}.deb
            dist/meshd_0.1.0~ci.${{ github.run_number }}_${{ matrix.arch }}.deb.sha256
            dist/meshd_0.1.0~ci.${{ github.run_number }}_${{ matrix.arch }}.deb.cdx.json
            dist/meshd_0.1.0~ci.${{ github.run_number }}_${{ matrix.arch }}.deb.cdx.json.sha256
            dist/meshd_0.1.0~ci.${{ github.run_number }}_${{ matrix.arch }}.deb.grype.json
            dist/meshd_0.1.0~ci.${{ github.run_number }}_${{ matrix.arch }}.deb.grype.json.sha256
          if-no-files-found: error
          retention-days: 14

  meshctl-package:
    name: Package meshctl (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Validate packaging scripts
        run: |
          bash -n packaging/linux/meshctl/build-deb.sh packaging/linux/meshctl/verify-deb.sh
          shellcheck packaging/linux/meshctl/build-deb.sh packaging/linux/meshctl/verify-deb.sh

      - name: Build and inspect package
        run: |
          bash packaging/linux/meshctl/build-deb.sh "0.1.0~ci.${GITHUB_RUN_NUMBER}" "${{ matrix.arch }}" dist
          bash packaging/linux/meshctl/verify-deb.sh "dist/meshctl_0.1.0~ci.${GITHUB_RUN_NUMBER}_${{ matrix.arch }}.deb" "${{ matrix.arch }}"
