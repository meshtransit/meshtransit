name: Quality

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Go quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Go from go.mod
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run repository gates
        run: make quality

  migration-integration:
    name: PostgreSQL migration integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_IMAGE: postgres:18.6-bookworm
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Go from go.mod
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run migration concurrency and idempotency checks
        run: make integration-migrations-container

  container:
    name: Container build and security gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONTAINER_TAG: ci
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Build hardened image
        env:
          CONTAINER_PLATFORM: linux/amd64
          CONTAINER_REVISION: ${{ github.sha }}
        run: make container-build

      - name: Verify and smoke-test image
        env:
          CONTAINER_REVISION: ${{ github.sha }}
        run: make container-inspect container-smoke

      - name: Scan image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: manhdev2002/meshtransit-core:ci
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: HIGH,CRITICAL
          vuln-type: os,library
          version: v0.74.0
