{{- if .Values.metrics.serviceMonitor }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "kg.fullname" . }}
  labels: {{- include "kg.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "kg.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: probes
      path: /metrics
{{- end }}
