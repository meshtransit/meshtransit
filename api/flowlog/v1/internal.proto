// Connection log v1, Core's internal API to the receiver (meshflow):
// what the receiver reads from Core over mutual TLS. Design:
// connection-logs-design.md §16c in the MeshTransit design repository.
//
// Conventions as in flowlog.proto: keys are raw bytes, IDs raw 16-byte
// UUIDs, times Unix milliseconds on the database's clock. Field numbers are
// never reused; removed fields are reserved. The receiver refuses unknown
// fields.
syntax = "proto3";

package meshtransit.flowlog.v1;

option go_package = "meshtransit.net/api/flowlog/v1;flowlogv1";

// FlowSigningKeys answers GET /internal/v1/flowlog/keys: the public keys
// tokens are signed with (C45). A receiver accepts tokens of CURRENT, NEXT
// and RETIRING keys, keeps a key it saw for 17 minutes after it was last
// listed, and drops a REVOKED key at once.
message FlowSigningKeys {
  repeated Key keys = 1;
  int64 generated_at_ms = 2;

  message Key {
    string kid = 1; // flowlog.SigningKeyID of public_key
    bytes public_key = 2; // Ed25519, 32 bytes
    State state = 3;
  }

  enum State {
    STATE_UNSPECIFIED = 0;
    CURRENT = 1;
    NEXT = 2;
    RETIRING = 3;
    REVOKED = 4;
  }
}

// FlowNetworks answers GET /internal/v1/flowlog/networks?after=&limit=:
// Networks with a destination whose Workspace has the feature, by Network
// ID (C47). next_after is set when another page may follow.
message FlowNetworks {
  repeated Network networks = 1;
  bytes next_after = 2;
  int64 generated_at_ms = 3;

  message Network {
    bytes workspace_id = 1;
    bytes network_id = 2;
    // enabled: the Network takes batches now. A Network listed but not
    // enabled has a destination to test (C48).
    bool enabled = 3;
    // destination_etag changes whenever the destination or its credential
    // does; the receiver reads the destination again then.
    bytes destination_etag = 4;
    // directory_revision is the Network's revision: the receiver reads the
    // directory again when it is higher than the one it holds (C59).
    uint64 directory_revision = 5;
  }
}

// FlowDestination answers GET /internal/v1/flowlog/workspaces/{w}/networks/
// {n}/destination: where the Network's batches go and why it does or does
// not take them (C44). A deleted Network or Workspace carries no
// credential.
message FlowDestination {
  Reason reason = 1;
  bool forwarded = 2;
  uint32 window_s = 3;
  string bucket = 4;
  string region = 5;
  string prefix = 6;
  Credential credential = 7;
  bytes destination_etag = 8;
  int64 generated_at_ms = 9;
  // expected_bucket_owner is the 12-digit AWS account that owns the S3
  // bucket, sent as x-amz-expected-bucket-owner; empty: the account the
  // credential belongs to (C52).
  string expected_bucket_owner = 10;

  message Credential {
    bytes credential_id = 1;
    Provider provider = 2;
    string account_id = 3; // R2 only
    // sealed opens with the receiver's credential key named by
    // sealing_key_id, bound to the Workspace, credential_id,
    // sealed_version, provider and account_id (flowlog.OpenCredential).
    bytes sealed = 4;
    uint64 sealed_version = 5;
    string sealing_key_id = 6;
  }

  enum Reason {
    REASON_UNSPECIFIED = 0;
    LOGGING = 1;
    DISABLED = 2;
    FEATURE_REVOKED = 3;
    NETWORK_SUSPENDED = 4;
    WORKSPACE_SUSPENDED = 5;
    NETWORK_DELETED = 6;
    WORKSPACE_DELETED = 7;
  }

  enum Provider {
    PROVIDER_UNSPECIFIED = 0;
    AWS_S3 = 1;
    CLOUDFLARE_R2 = 2;
  }
}

// FlowRevocations answers GET /internal/v1/flowlog/revocations: machine keys
// that stopped being valid in the last 18 minutes, by Network and Device
// (C46). A receiver refuses a token naming one; it fails closed when its
// last good read is older than 15 seconds.
message FlowRevocations {
  repeated Revocation revocations = 1;
  int64 generated_at_ms = 2;

  message Revocation {
    bytes network_id = 1;
    bytes device_id = 2;
    bytes machine_key = 3;
  }
}

// FlowDirectory answers GET /internal/v1/flowlog/workspaces/{w}/networks/
// {n}/directory: what names a record's endpoints and checks a reporter's
// role, read in one snapshot (C61). The answer's ETag is of its content,
// revision included. A 200 and a 304 alike carry the revision, built_at_ms
// and generated_at_ms as the MeshTransit-Directory-Revision, -Built-At and
// -Generated-At headers (C64). Replicas may answer different revisions: a
// receiver keeps the highest it has seen (C62). Tag and group names change
// without a new revision: a receiver reads again at least every minute
// (C59).
message FlowDirectory {
  uint64 revision = 1;
  // built_at_ms is when the snapshot was read; a replica answers a build
  // for at most a minute.
  int64 built_at_ms = 2;
  int64 generated_at_ms = 3;
  // mesh_prefixes are the Network's own address prefixes.
  repeated Prefix mesh_prefixes = 4;
  // alias_prefixes are the deployment's alias pools: an address in them is
  // a share's, never a public one (C61).
  repeated Prefix alias_prefixes = 5;
  // tags and groups are dictionaries a Device names by index.
  repeated Name tags = 6;
  repeated Name groups = 7;
  repeated Device devices = 8;
  repeated Site sites = 9;
  repeated ExitPool exit_pools = 10;
  // contract_aliases are the alias addresses of the shares the Network
  // consumes, by Trust Contract: a share's record names its contract by
  // them (C63). Nothing of the provider is listed.
  repeated ContractAlias contract_aliases = 11;

  message Prefix {
    bytes address = 1; // 4 or 16 bytes
    uint32 bits = 2;
  }

  message Name {
    bytes id = 1;
    string name = 2;
  }

  // Device is a live Device, or for 25 hours the tombstone of a deleted
  // one: its ID, kind, state DELETED and pseudonym if it still has one.
  message Device {
    bytes device_id = 1;
    Kind kind = 2;
    State state = 3;
    string hostname = 4;
    repeated bytes addresses = 5; // 4 or 16 bytes each
    OwnerKind owner_kind = 6;
    // owner_pseudonym is the owning membership's (C60); empty: the
    // Workspace owns the Device, or its owner is no longer a member.
    bytes owner_pseudonym = 7;
    repeated uint32 tags = 8; // indexes into tags
    repeated uint32 groups = 9; // indexes into groups
    // names_truncated: the Device has more than 64 tags or groups.
    bool names_truncated = 10;
  }

  message Site {
    bytes site_id = 1;
    repeated Prefix prefixes = 2;
    repeated bytes routers = 3; // Device IDs
  }

  message ContractAlias {
    bytes trust_contract_id = 1;
    bytes address = 2; // 4 or 16 bytes
  }

  message ExitPool {
    bytes exit_pool_id = 1;
    repeated bytes candidates = 2; // Device IDs
  }

  enum Kind {
    KIND_UNSPECIFIED = 0;
    STANDARD = 1;
    KUBERNETES_GATEWAY = 2;
  }

  enum State {
    STATE_UNSPECIFIED = 0;
    ACTIVE = 1;
    EXPIRED = 2;
    SUSPENDED = 3;
    REVOKED = 4;
    DELETED = 5;
  }

  enum OwnerKind {
    OWNER_KIND_UNSPECIFIED = 0;
    MEMBER = 1;
    WORKSPACE = 2;
  }
}

// FlowStatus is the body of POST /internal/v1/flowlog/status: what one
// receiver instance can take, and how the Networks it holds fare (C67).
// Core decodes it leniently, so a newer receiver's fields and enum values
// never fail a report; it answers 204, 400 (malformed or a Network twice),
// 429 (too many instances) or 503 (busy).
message FlowStatus {
  bytes instance_id = 1; // 16 random bytes for the process's life
  repeated uint32 accepted_versions = 2; // flowlog-v1 is 1
  // noise_fingerprints are SHA-256 of the static Noise public keys it holds.
  repeated bytes noise_fingerprints = 3;
  repeated string sealing_key_ids = 4;
  int64 reported_at_ms = 5; // the receiver's clock
  repeated Network networks = 6;

  message Network {
    bytes workspace_id = 1;
    bytes network_id = 2;
    // tested_etag is the destination_etag the test write used.
    bytes tested_etag = 3;
    TestResult test_result = 4;
    int64 tested_at_ms = 5;
    int64 last_delivered_at_ms = 6;
    DeliveryError delivery_error = 7;
    uint64 lost_24h = 8;
    uint64 overflow_24h = 9;
  }

  enum TestResult {
    TEST_RESULT_UNSPECIFIED = 0;
    TEST_OK = 1;
    TEST_ACCESS_DENIED = 2;
    TEST_NO_SUCH_BUCKET = 3;
    TEST_WRONG_OWNER = 4;
    TEST_WRONG_REGION = 5;
    TEST_UNREACHABLE = 6;
    TEST_CREDENTIAL_UNOPENABLE = 7;
    TEST_OTHER = 8;
  }

  enum DeliveryError {
    DELIVERY_ERROR_UNSPECIFIED = 0;
    DELIVERY_NONE = 1;
    DELIVERY_ACCESS_DENIED = 2;
    DELIVERY_NO_SUCH_BUCKET = 3;
    DELIVERY_WRONG_OWNER = 4;
    DELIVERY_WRONG_REGION = 5;
    DELIVERY_UNREACHABLE = 6;
    DELIVERY_THROTTLED = 7;
    DELIVERY_OTHER = 8;
  }
}
