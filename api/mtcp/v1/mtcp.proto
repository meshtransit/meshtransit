// MTCP v1 message schema. Normative text: docs/protocol/mtcp-v1.md.
//
// Conventions:
//   - Keys are raw 32-byte values (never text forms).
//   - IP addresses are 4 or 16 raw bytes; IPv4 is always 4 bytes.
//   - Times are Unix milliseconds (int64); 0 means unset.
//   - Field numbers are never reused; removed fields are reserved.
syntax = "proto3";

package meshtransit.mtcp.v1;

option go_package = "meshtransit.net/api/mtcp/v1;mtcpv1";

// ---- Handshake payloads (inside Noise INIT / RESPONSE) ----

message ClientHello {
  uint32 protocol_version = 1;
  int64 timestamp_ms = 2;
  ClientInfo client = 3;
  repeated string capabilities = 4;
  bytes node_key = 5;
  bytes profile_hint = 6;
}

message ClientInfo {
  string product = 1; // "meshd"
  string version = 2;
  string os = 3;
  string os_version = 4;
  string arch = 5;
}

message ServerHello {
  uint32 protocol_version = 1;
  int64 server_time_ms = 2;
  bytes session_id = 3;
  repeated string capabilities = 4;
  Limits limits = 5;
  bytes profile_hint = 6;
  Reject reject = 7;

  enum Reject {
    REJECT_UNSPECIFIED = 0; // not rejected
    VERSION_UNSUPPORTED = 1;
    CLIENT_TOO_OLD = 2;
    MAINTENANCE = 3;
  }
}

message Limits {
  uint32 keepalive_s = 1;
  uint32 idle_timeout_s = 2;
  uint32 max_unacked_map = 3;
}

// ---- Session ----

message Error {
  Code code = 1;
  string message = 2;
  uint32 retry_after_ms = 3;
  bool fatal = 4;

  enum Code {
    CODE_UNSPECIFIED = 0;
    INVALID = 1;
    UNSUPPORTED = 2;
    NOT_AUTHORIZED = 3;
    NOT_PERMITTED = 4;
    SESSION_REPLACED = 5;
    OVERLOADED = 6;
    INTERNAL = 7;
  }
}

message Ping {
  bytes nonce = 1; // ≤ 32 bytes
}

message Pong {
  bytes nonce = 1;
}

// ---- Registration ----

message RegisterRequest {
  bytes node_key = 1;
  bytes disco_key = 2;
  Hostinfo hostinfo = 3;
  Auth auth = 4;
  bytes node_key_proof = 5; // mtcp-v1 §6.4
  bytes disco_key_proof = 6;

  message Auth {
    oneof method {
      string enrollment_key = 1; // mtc1.<id>.<secret>; never logged
      Interactive interactive = 2;
      Resume resume = 3;
      ClusterJoin cluster_join = 4; // a Kubernetes gateway replica (mtcp-v1 §6.6)
    }
  }

  // ClusterJoin asks to join a Kubernetes cluster with its join key. Core
  // answers Pending{admin_approval} until an administrator approves the
  // request by the code the replica prints, then Authorized on the session.
  message ClusterJoin {
    string join_key = 1; // mtk1.<id>.<secret>; never logged
    bytes reported = 2;  // JSON object of up to 16 short strings, display only
  }

  message Interactive {
    string resume_handle = 1; // from an earlier Pending response, or empty
  }

  message Resume {}
}

message RegisterResponse {
  oneof outcome {
    Authorized authorized = 1;
    Pending pending = 2;
    Rejected rejected = 3;
  }

  message Authorized {
    string device_id = 1;
    string network_id = 2;
    repeated bytes addresses = 3;
    int64 key_expiry_ms = 4;
  }

  message Pending {
    string approval_url = 1;
    string resume_handle = 2; // bound to this machine key and node key
    int64 expires_ms = 3;
    AdminApproval admin_approval = 4; // a cluster join waits for an administrator, no URL
  }

  // AdminApproval is what a replica needs to print its code (mtcp-v1 §6.6).
  message AdminApproval {
    string cluster_id = 1;    // the cluster's public ID
    string request_id = 2;    // the request's public ID
    bytes request_nonce = 3;  // 32 bytes Core chose
  }

  message Rejected {
    Code code = 1;
    string message = 2;

    enum Code {
      CODE_UNSPECIFIED = 0;
      INVALID = 1;
      CREDENTIAL_INVALID = 2;
      CREDENTIAL_EXHAUSTED = 3;
      NOT_PERMITTED = 4;
      CONFLICT = 5;
      EXPIRED = 6;
    }
  }
}

message RotateNodeKey {
  bytes new_node_key = 1;
  bytes new_disco_key = 2;
  bytes node_key_proof = 3; // mtcp-v1 §6.4, for the new node key
  bytes disco_key_proof = 4;
}

message RotateNodeKeyResponse {
  bytes node_key = 1; // the Device's node key after the request
  int64 key_expiry_ms = 2;
}

message Logout {}

// ---- Map ----

message View {
  uint64 epoch = 1;
  uint64 seq = 2;
}

message NetworkRevision {
  string network_id = 1;
  uint64 revision = 2;
}

message MapSnapshot {
  View view = 1;
  repeated NetworkRevision network_revisions = 2;
  Device self = 3;
  repeated Device peers = 4; // sorted by device_id
  PacketFilter packet_filter = 5;
  DnsConfig dns = 6;
  bytes relay_map = 7; // signed relay map (MTRP v1 §8)
  Settings settings = 8;
  RouteConfig routes = 9; // routes.subnet.v1: subnet routes this node may use
  ServedRoutes served = 10; // router.subnet.v1: subnets this node forwards to
  ExitConfig exits = 11; // routes.exit.v1: Exit Pools this node may use (section 7.7)
  ServedExits served_exits = 12; // router.exit.v1: the Exit Pool this node is an exit node of
}

message MapDelta {
  View view = 1;
  repeated NetworkRevision network_revisions = 2;
  Device self = 3;
  repeated Device peers_upsert = 4;
  repeated string peers_remove = 5;
  repeated PeerPatch peer_patches = 6;
  PacketFilter packet_filter = 7; // replaces the filter when set
  DnsConfig dns = 8; // replaces DNS when set
  bytes relay_map = 9; // replaces the relay map when non-empty
  Settings settings = 10; // replaces settings when set
  RouteConfig routes = 11; // replaces routes when set; set and empty clears them
  ServedRoutes served = 12; // replaces served routes when set; set and empty clears them
  ExitConfig exits = 13; // replaces Exit Pools when set; set and empty clears them
  ServedExits served_exits = 14; // replaces served Exit Pools when set; set and empty clears them
}

message MapAck {
  View view = 1;
}

message MapResync {
  View view = 1; // the node's current view
}

message Device {
  string device_id = 1;
  string name = 2;
  string display_name = 3;
  bytes node_key = 4;
  bytes disco_key = 5;
  repeated bytes addresses = 6;
  repeated Prefix allowed_prefixes = 7;
  repeated Endpoint endpoints = 8;
  NatInfo nat = 9;
  uint32 home_relay = 10;
  optional bool online = 11; // absent: Core has no connectivity for the Device
  int64 last_seen_ms = 12;
  int64 key_expiry_ms = 13;
  Owner owner = 14;
  repeated string capabilities = 15;
  AliasGrant alias = 16;
}

message PeerPatch {
  string device_id = 1;
  // Each present field replaces the peer's value.
  optional bytes disco_key = 2;
  EndpointList endpoints = 3;
  optional uint32 home_relay = 4;
  optional bool online = 5;
  optional int64 last_seen_ms = 6;
  NatInfo nat = 7;
}

message EndpointList {
  repeated Endpoint items = 1;
}

message Owner {
  string ref = 1; // opaque
  string display_name = 2;
}

message Prefix {
  bytes ip = 1;
  uint32 bits = 2;
}

message Endpoint {
  bytes ip = 1;
  uint32 port = 2;
  Kind kind = 3;

  // Values match disco v2 endpoint kinds.
  enum Kind {
    KIND_UNSPECIFIED = 0;
    HOST = 1;
    SERVER_REFLEXIVE = 2;
    PORT_MAPPED = 3;
    STATIC = 4;
    PEER_REFLEXIVE = 5;
  }
}

// Values match docs/protocol/nat-classification.md §1.
message NatInfo {
  uint32 mapping = 1;
  uint32 filtering = 2;
  uint32 allocation = 3;
  uint32 sequential_step = 4;
}

message AliasGrant {
  string contract_id = 1;
  string endpoint_id = 2;
  uint64 generation = 3;
  uint64 grant_revision = 4;
  uint64 recovery_epoch = 5;
  Role role = 6;
  int64 expires_ms = 7;
  repeated AliasService services = 8;
  bytes masquerade_v4 = 9;
  bytes masquerade_v6 = 10;

  enum Role {
    ROLE_UNSPECIFIED = 0;
    CONSUMER = 1;
    PROVIDER = 2;
  }
}

message AliasService {
  uint32 protocol = 1;
  uint32 port_from = 2;
  uint32 port_to = 3;
}

message PacketFilter {
  repeated FilterRule rules = 1;
}

message FilterRule {
  repeated Prefix sources = 1;
  repeated Destination destinations = 2;
  repeated uint32 protocols = 3; // empty: TCP, UDP and ICMP
}

message Destination {
  Prefix prefix = 1;
  repeated PortRange ports = 2; // empty: all ports
}

message PortRange {
  uint32 first = 1;
  uint32 last = 2;
}

// ---- Exit Pools (section 7.7) ----

message ExitConfig {
  repeated ExitPool pools = 1; // sorted by pool_ref, at most 64
}

// ExitPool is one Exit Pool this node may send its Internet traffic
// through: policy grants it, and its exit nodes forward to the Internet.
message ExitPool {
  string pool_ref = 1; // opaque, stable for the pool, 1 to 64 bytes of UTF-8
  string name = 2; // the pool's display name, 1 to 64 characters without controls
  // Priority order; SPREAD: this node's own order (section 7.7).
  repeated ExitCandidate candidates = 3; // 1 to 16
  // The exit node Core chose, one of candidates; empty when none. SPREAD:
  // the exit node Core assigned to this node.
  string primary = 4;
  uint64 generation = 5; // per pool; increases whenever primary changes, never goes back
  Status status = 6;
  bool managed = 7; // the administrator asks this node to use this pool
  Mode mode = 8; // how the pool serves its consumers; UNSPECIFIED reads as FAILOVER
  // The node's root may not open captive portal windows while it uses the
  // pool (section 7.7); Core can only refuse them, never open one.
  bool captive_off = 9;

  enum Status {
    STATUS_UNSPECIFIED = 0;
    SERVED = 1; // send through primary
    UNSERVED = 2; // granted, but no exit node can serve now
    CAPACITY = 3; // the exit nodes' maps cannot hold this node
  }
  enum Mode {
    MODE_UNSPECIFIED = 0;
    FAILOVER = 1; // every consumer through the elected primary
    SPREAD = 2; // each consumer through its own exit node of the pool
  }
}

// ExitCandidate is one exit node of a pool as Core last heard of it.
message ExitCandidate {
  string device_id = 1;
  State state = 2; // from the exit node's last health report
  Families families = 3; // the address families it reaches the Internet in
  bytes dns_ipv4 = 4; // overlay address of its DNS forwarder; empty when none
  bytes dns_ipv6 = 5;
  bool draining = 6; // the administrator is taking it out of the pool

  enum State {
    STATE_UNSPECIFIED = 0; // no recent report
    OK = 1;
    DEGRADED = 2;
    FAILED = 3;
  }
  enum Families {
    FAMILIES_UNSPECIFIED = 0; // not known
    V4 = 1;
    V6 = 2;
    BOTH = 3;
  }
}

message ServedExits {
  repeated ServedExit pools = 1; // at most 1: a Device is an exit node of one pool
}

// ServedExit is the Exit Pool this node forwards to the Internet for.
message ServedExit {
  string pool_ref = 1;
  repeated ExitProbe probes = 2; // Internet addresses only
  uint32 conntrack_per_consumer = 3; // a local limit may only lower it
  bool smtp_allowed = 4; // a local setting may only refuse it
  repeated bytes dns_upstreams = 5; // IPv4 or IPv6 addresses on the Internet, tried in order
  repeated FilterRule rules = 6; // the pool's rules: sources and traffic; destinations are always 0/0 and ::/0
  repeated bytes dns_relay_targets = 7; // Internet resolvers (port 53) of the Network's DNS zones the forwarder may relay to for any consumer
  repeated DNSRelayScope dns_relay_scopes = 8; // resolvers it may relay to for some consumers only; at most 64, at most 256 resolvers with dns_relay_targets
}

// DNSRelayScope is resolvers of DNS zones sent to some Device Groups only:
// the forwarder relays to them for the consumers in sources alone.
message DNSRelayScope {
  repeated bytes targets = 1; // Internet resolvers (port 53), each once
  repeated Prefix sources = 2; // consumers' mesh addresses, as host prefixes
}

// ExitProbe is an Internet address and TCP port an exit node connects to,
// through its own forwarding path, to check it reaches the Internet.
message ExitProbe {
  bytes ip = 1;
  uint32 port = 2;
}

// ---- Subnet routes (section 7.6) ----

message RouteConfig {
  repeated SiteRoute sites = 1; // sorted by site_ref
}

// SiteRoute is one Site this node may reach: the prefixes its policy grants
// and the routers that forward to them.
message SiteRoute {
  string site_ref = 1; // opaque, stable for the Site, 1 to 64 bytes of UTF-8
  repeated Prefix prefixes = 2; // canonical, sorted, 1 to 1,024
  repeated string candidates = 3; // router device_ids; static priority order, changed only on router assignment
  string primary = 4; // the router Core chose, one of candidates; empty when none
  uint64 generation = 5; // per Site; increases whenever primary changes, never goes back
  Status status = 6;
  string name = 7; // the Site's display name, 1 to 64 characters without controls; empty from an older Core

  enum Status {
    STATUS_UNSPECIFIED = 0;
    SERVED = 1; // forward through primary
    UNSERVED = 2; // granted, but no router can serve now
    CONFLICT = 3; // overlaps another granted Site
    CAPACITY = 4; // the routers' maps cannot hold this node
  }
}

message ServedRoutes {
  repeated ServedSite sites = 1; // sorted by site_ref
}

// ServedSite is one Site this node forwards to as a router.
message ServedSite {
  string site_ref = 1;
  repeated Prefix prefixes = 2;
  bool masquerade = 3; // translate mesh sources to the router's own address
  repeated RouteProbe probes = 4;
}

message RouteProbe {
  bytes ip = 1; // inside the Site's prefixes
  Kind kind = 2;
  uint32 port = 3; // TCP only

  enum Kind {
    KIND_UNSPECIFIED = 0;
    ICMP = 1;
    TCP = 2;
  }
}

message DnsConfig {
  repeated DnsRecord records = 1;
  repeated Resolver resolvers = 2;
  repeated string search_domains = 3;
  repeated DnsRoute routes = 4;
  // Host names of the deployment's own services (its Console, identity
  // provider, names the operator protects) a root zone leaves to the
  // host's network, as it does the control host and the relays' hosts
  // (dns.root1, mtcp-v1 §7.3). Sent only with a root zone; at most 64.
  repeated string infrastructure_names = 5;
}

message DnsRecord {
  string name = 1;
  Type type = 2;
  bytes value = 3; // A and AAAA: the address
  // dns.records1, CNAME: the name the record points at, without a trailing
  // dot (mtcp-v1 §7.3).
  string target = 4;

  enum Type {
    TYPE_UNSPECIFIED = 0;
    A = 1;
    CNAME = 5;
    AAAA = 28;
  }
}

message Resolver {
  bytes ip = 1;
  string url = 2; // optional DoH (https://) or DoT (tls://) URL
  uint32 port = 3; // dns.forward1: UDP and TCP port; 0 is 53
}

message DnsRoute {
  string suffix = 1;
  repeated Resolver resolvers = 2;
  // dns.forward1: the zone exists but none of its resolvers can be used
  // now; the node keeps the route and applies fail_open (mtcp-v1 §7.3).
  bool unavailable = 3;
  // dns.forward1: when no resolver answers, ask the system's own DNS (or
  // the exit's forwarder while an exit is in use) instead of SERVFAIL.
  bool fail_open = 4;
}

message Settings {
  uint32 endpoint_report_s = 1;
  uint32 path_stats_s = 2;
  bool path_stats_enabled = 3;
}

// ---- Reports ----

message EndpointReport {
  bytes disco_key = 1;
  repeated Endpoint endpoints = 2;
  NatInfo nat = 3;
  bool ipv6_global = 4;
  bool ipv6_stun = 5;
  uint32 preferred_relay = 6;
  int64 observed_ms = 7;
  // The node's gateway port mapping; absent when the node does not map.
  PortMapping port_mapping = 8;
  // When nat was classified; zero when nat is absent.
  int64 nat_observed_ms = 9;
}

// PortMapping is the state of the node's mapping on its local gateway. It
// never carries the external address: that is a PORT_MAPPED endpoint.
// Codes are numbers so that a newer node's values never invalidate the
// report; unknown codes read as unknown.
message PortMapping {
  uint32 protocol = 1;   // 0 unknown, 1 PCP, 2 NAT-PMP, 3 UPnP IGD
  uint32 state = 2;      // 0 unknown, 1 off, 2 searching, 3 mapped, 4 double NAT, 5 unavailable, 6 failed
  int64 expires_ms = 3;  // mapping expiry; zero for permanent or none
}

message Hostinfo {
  string hostname = 1;
  string os = 2;
  string os_version = 3;
  string client_version = 4;
  string arch = 5;
  string device_model = 6;
  repeated Prefix advertised_prefixes = 7; // subnets this node offers to forward, at most 256 (section 8.2)
  bool exit_offered = 8; // this node's own configuration offers to be an exit node (section 7.7)
}

message HostinfoReport {
  Hostinfo hostinfo = 1;
}

message HealthReport {
  repeated Component components = 1;

  message Component {
    Name name = 1;
    State state = 2;
    string code = 3; // short machine-readable reason, ≤ 64 bytes

    enum Name {
      NAME_UNSPECIFIED = 0;
      DATA_PLANE = 1;
      DNS = 2;
      RELAY = 3;
      CLOCK = 4;
    }

    enum State {
      STATE_UNSPECIFIED = 0;
      OK = 1;
      DEGRADED = 2;
      FAILED = 3;
    }
  }
}

// RouteHealthReport is a subnet router's health of each Site it serves
// (section 8.3): the whole set, on change and every 10 seconds while it
// serves any; empty once it serves none.
message RouteHealthReport {
  repeated SiteHealth sites = 1; // at most 1,024, sorted by site_ref, each once
  ExitHealth exit = 2; // router.exit.v1: the served Exit Pool's health (section 7.7); unset when none

  message ExitHealth {
    string pool_ref = 1; // as in ServedExit
    SiteHealth.State state = 2;
    string code = 3; // short machine-readable reason, ≤ 64 bytes
    ExitCandidate.Families families = 4; // the families this node reaches the Internet in
  }

  message SiteHealth {
    string site_ref = 1; // as in ServedSite
    State state = 2;
    string code = 3; // short machine-readable reason, ≤ 64 bytes

    enum State {
      STATE_UNSPECIFIED = 0;
      OK = 1;
      DEGRADED = 2; // a warning only
      FAILED = 3;
    }
  }
}

// RouteSelectionReport is the router a consumer sends each Site's traffic
// to (section 8.3): the whole set, on change and every 60 seconds while it
// reaches any Site; empty once it reaches none.
message RouteSelectionReport {
  repeated SiteSelection sites = 1; // at most 1,024, sorted by site_ref, each once
  ExitSelection exit = 2; // routes.exit.v1: the exit node this node sends its Internet traffic to; unset when it uses none

  message ExitSelection {
    string pool_ref = 1; // as in ExitPool
    string exit_node = 2; // one of the pool's candidates; empty with NONE
    Reason reason = 3;

    enum Reason {
      REASON_UNSPECIFIED = 0;
      PRIMARY = 1; // the primary of the map
      LOCAL_FAILOVER = 2; // another candidate this node chose while the one it used does not answer
      STICKY = 3; // the candidate this node kept using after Core chose another primary (section 7.7)
      NONE = 4; // the pool is not served: no exit node
    }
  }

  message SiteSelection {
    string site_ref = 1; // as in SiteRoute
    string router = 2; // one of the Site's candidates; empty with NONE
    Reason reason = 3;

    enum Reason {
      REASON_UNSPECIFIED = 0;
      PRIMARY = 1; // the primary of the map
      LOCAL_FAILOVER = 2; // another candidate this node chose while the primary does not answer
      NONE = 3; // the Site is not served: no router
    }
  }
}

// CaptiveWindowReport is the captive portal windows root opened on this node
// while it used an exit node (section 8.5), each once after it closed: when
// it opened and closed and how it ended, never the portal's address.
message CaptiveWindowReport {
  repeated CaptiveWindow windows = 1; // 1 to 16; Core takes the first of a window_id listed twice
}

message CaptiveWindow {
  string window_id = 1; // 32 lowercase hexadecimal characters, chosen by root's window file
  int64 opened_ms = 2;
  int64 closed_ms = 3; // at most 6 minutes after opened_ms
  End end = 4;

  enum End {
    END_UNSPECIFIED = 0;
    EXPIRED = 1; // its time ran out
    CLOSED = 2; // root closed it, or the node stopped using the exit node or the pool turned windows off
    TUNNEL_BACK = 3; // the node closed it once its tunnel was back
  }
}

// EnforcementReport is the policy digest (docs/protocol/policy-digest-v1.md)
// of the rules the packet filter enforces after applying the map at view.
message EnforcementReport {
  View view = 1;
  bytes digest = 2; // 32 bytes
  uint32 grants = 3;
  int64 applied_ms = 4;
  bytes route_digest = 5; // 32 bytes: route digest v1 of the served routes forwarded into; empty without router.subnet.v1
  uint32 route_entries = 6;
  // dns.root1: DNS digest v1 (docs/protocol/dns-digest-v1.md) of the DNS
  // routes and search domains the node applied to its host; empty when it
  // applies none, with dns_reason saying why.
  bytes dns_digest = 7; // 32 bytes
  uint32 dns_routes = 8;
  string dns_reason = 9; // empty, "user_off" or "apply_failed"; at most 32 bytes
}

// DnsHealthReport is how the node's resolver sees the resolvers of the DNS
// zones it applies (dns.root1, section 8.6): the whole set, on change and
// at least every 5 minutes while it applies any.
message DnsHealthReport {
  repeated ResolverHealth resolvers = 1; // at most 64, the root zone's first
}

message ResolverHealth {
  bytes ip = 1; // 4 or 16 bytes: as the map sent it
  uint32 port = 2; // 0 is 53
  State state = 3;
  int64 last_ok_ms = 4; // the last answer from it; 0: none since applied

  enum State {
    STATE_UNSPECIFIED = 0;
    OK = 1; // it answers
    BROKEN = 2; // the circuit breaker skips it
    STOPPED = 3; // a resolver Device that stopped answering pings: asked last
    REFUSING = 4; // its last answer was SERVFAIL or REFUSED
    IDLE = 5; // not asked since the zones were applied
  }
}

message PathStatsReport {
  int64 interval_start_ms = 1;
  uint32 interval_s = 2;
  repeated PeerPathStats peers = 3;
}

message PeerPathStats {
  string device_id = 1;
  uint64 direct_tx_bytes = 2;
  uint64 direct_rx_bytes = 3;
  uint64 relay_tx_bytes = 4;
  uint64 relay_rx_bytes = 5;
  uint64 direct_tx_packets = 6;
  uint64 direct_rx_packets = 7;
  Technique technique = 8;
  uint32 relay_region = 9;
  uint32 rtt_ms_bucket = 10;
  uint64 relay_tx_packets = 11;
  uint64 relay_rx_packets = 12;
  RelayReason relay_reason = 13; // why the path is relayed, when it is

  enum RelayReason {
    RELAY_REASON_UNSPECIFIED = 0;
    BOOTSTRAP = 1;     // relayed while direct candidates are being probed
    NO_CANDIDATES = 2; // the peer offers no direct candidate
    NO_RESPONSE = 3;   // direct probes went unanswered (filtered UDP or hard NAT)
  }

  enum Technique {
    TECHNIQUE_UNSPECIFIED = 0;
    RELAY = 1;
    DIRECT = 2;
    PEER_REFLEXIVE = 3;
    PREDICTION = 4;
    BIRTHDAY = 5;
  }
}

// ---- Relay, lifecycle, keys ----

message RelayTicket {
  bytes ticket = 1; // MTRP v1 ticket ("MTT1", or "MTT2" with relay.zones2)
  int64 not_after_ms = 2;
  // MTT2 only: every zone the ticket commits to, canonical, 17 bytes each
  // (MTRP v1 §6.1). The node hands the zones past the inline ones to the
  // relay in ZONES frames.
  bytes zones = 3;
  // MTT2 only: an MTT1 ticket for the same keys naming the inline zones,
  // for relays that do not take MTT2.
  bytes fallback_ticket = 4;
}

message Lifecycle {
  State state = 1;
  string reason = 2;
  uint32 retry_after_ms = 3;
  int64 not_before_ms = 4;

  enum State {
    STATE_UNSPECIFIED = 0;
    ACTIVE = 1;
    SUSPENDED = 2;
    EXPIRED = 3;
    REVOKED = 4;
    LOGGED_OUT = 5;
    REAUTH_REQUIRED = 6;
    RECONNECT = 7;
  }
}

message KeyUpdate {
  repeated ControlKey control_keys = 1; // at most 2
  repeated SigningKey signing_keys = 2; // at most 4
  bytes nonce = 3; // ≤ 32 bytes; the node answers Pong{nonce} once stored

  message ControlKey {
    bytes key = 1;
    int64 not_after_ms = 2;
  }

  message SigningKey {
    bytes key_id = 1; // 8 bytes, keys.md
    bytes key = 2; // Ed25519 public key
    int64 not_after_ms = 3;
  }
}

message Notice {
  Severity severity = 1;
  string text = 2; // shown to the user; ≤ 1024 bytes
  string url = 3; // optional https link

  enum Severity {
    SEVERITY_UNSPECIFIED = 0;
