<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Signing in | MeshTransit</title>
<style>
:root { color-scheme: dark; --background: #09090b; --surface: #141417; --border: #27272a; --foreground: #f4f4f5; --muted: #a1a1aa; --accent: #e5484d; --focus: #f87171; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; background: radial-gradient(60rem 30rem at 50% -10%, rgba(229, 72, 77, .12), transparent), var(--background); color: var(--foreground); font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { width: 100%; max-width: 26rem; padding: 2rem 1.75rem; border: 1px solid var(--border); border-radius: 1rem; background: var(--surface); text-align: center; }
.spinner { width: 2rem; height: 2rem; margin: 0 auto 1.25rem; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
main[aria-busy="false"] .spinner { visibility: hidden; animation: none; }
h1 { margin: 0 0 .5rem; font-size: 1.25rem; line-height: 1.3; }
p { margin: 0; color: var(--muted); }
a { display: inline-block; margin-top: 1.25rem; padding: .625rem 1.125rem; border-radius: .5rem; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; }
a:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
</style>
</head>
<body>
<main id="login-panel" aria-busy="true" data-return-path="{{.ReturnPath}}">
<div class="spinner" aria-hidden="true"></div>
<h1>Signing you in</h1>
<p id="login-status" role="status" aria-live="polite" aria-atomic="true">Finishing secure sign-in.</p>
<a id="login-restart" href="/" hidden>Restart sign-in</a>
<noscript><p>JavaScript is required. Close this page and restart sign-in in a supported browser.</p></noscript>
</main>
<script>
"use strict";
(() => {
  const cleanPath = "/auth/v1/login/continue";
  const status = document.getElementById("login-status");
  const panel = document.getElementById("login-panel");
  const restart = document.getElementById("login-restart");
  const failure = "Sign-in could not be completed. Restart sign-in to try again.";
  let started = false;
  let controller;

  function localPath(path) {
    if (typeof path !== "string" || path.length > 256 || !/^\/[A-Za-z0-9/._~-]*$/.test(path)) return false;
    if (path === "/") return true;
    if (path.endsWith("/") || path.includes("//") || path === "/auth" || path.startsWith("/auth/")) return false;
    return !path.split("/").some(part => part === "." || part === "..");
  }

  function exactObject(value, keys) {
    return value !== null && typeof value === "object" && !Array.isArray(value) &&
      Object.keys(value).sort().join(",") === keys.slice().sort().join(",");
  }

  async function readJSON(response) {
    if (response.status !== 200 || response.redirected || response.type !== "basic" ||
        response.headers.get("content-type") !== "application/json" || !response.body) throw new Error("rejected");
    const reader = response.body.getReader();
    const chunks = [];
    let size = 0;
    try {
      while (true) {
        const chunk = await reader.read();
        if (chunk.done) break;
        if (chunk.value.byteLength === 0) throw new Error("rejected");
        size += chunk.value.byteLength;
        if (size > 1024) throw new Error("rejected");
        chunks.push(chunk.value);
      }
      const bytes = new Uint8Array(size);
      let offset = 0;
      for (const chunk of chunks) {
        bytes.set(chunk, offset);
        offset += chunk.byteLength;
      }
      const text = new TextDecoder("utf-8", { fatal: true }).decode(bytes);
      // Accept only the two Core-owned canonical encodings; duplicates/aliases
      // and unrelated fields cannot be silently normalized by JSON.parse.
      const canonical = /^\{"csrf_token":"[A-Za-z0-9_-]{1,512}","expires_in":[1-9][0-9]{0,2}\}$/.test(text) ||
        /^\{"return_path":"\/[A-Za-z0-9/._~-]{0,255}"\}$/.test(text);
      if (!canonical) throw new Error("rejected");
      return JSON.parse(text);
    } finally {
      reader.releaseLock();
    }
  }

  function post(path, token) {
    const headers = { "Content-Type": "application/json", "X-MeshTransit-Login": "v1" };
    if (token) headers["X-MeshTransit-CSRF"] = token;
    return fetch(path, { method: "POST", mode: "same-origin", credentials: "same-origin", redirect: "error",
      cache: "no-store", referrerPolicy: "no-referrer", headers, body: "{}", signal: controller.signal });
  }

  function fail() {
    panel.setAttribute("aria-busy", "false");
    status.textContent = failure;
    restart.hidden = false;
  }

  function hide() {
    started = true;
    if (controller) controller.abort();
    fail();
  }

  // One attempt only: the server claim is single-use and bound to this
  // browser's initiation cookie, so a failure restarts sign-in instead of retrying.
  async function complete(expectedPath) {
    if (started) return;
    started = true;
    controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 30000);
    let token = "";
    try {
      const prepared = await readJSON(await post(cleanPath + "/prepare", ""));
      if (!exactObject(prepared, ["csrf_token", "expires_in"]) ||
          typeof prepared.csrf_token !== "string" || !/^[A-Za-z0-9_-]{1,512}$/.test(prepared.csrf_token) ||
          !Number.isInteger(prepared.expires_in) || prepared.expires_in < 1 || prepared.expires_in > 120) {
        throw new Error("rejected");
      }
      token = prepared.csrf_token;
      const completed = await readJSON(await post(cleanPath, token));
      if (!exactObject(completed, ["return_path"]) || completed.return_path !== expectedPath ||
          controller.signal.aborted) throw new Error("rejected");
      window.location.replace(expectedPath);
    } catch {
      fail();
    } finally {
      token = "";
      clearTimeout(timer);
      controller.abort();
      window.removeEventListener("pagehide", hide);
    }
  }

  try {
    // Scrub even an inherited fragment without reading any query/fragment material.
    window.history.replaceState(null, "", cleanPath);
    const expectedPath = panel.dataset.returnPath;
    if (!localPath(expectedPath) || typeof AbortController !== "function" ||
        typeof TextDecoder !== "function" || typeof fetch !== "function") throw new Error("rejected");
    window.addEventListener("pagehide", hide, { once: true });
    // Start only once the page is really shown: never from a prerender or a
    // background tab the person has not opened.
    const begin = () => {
      if (document.prerendering || document.visibilityState !== "visible") return;
      document.removeEventListener("visibilitychange", begin);
      document.removeEventListener("prerenderingchange", begin);
      complete(expectedPath);
    };
    document.addEventListener("visibilitychange", begin);
    document.addEventListener("prerenderingchange", begin);
    begin();
  } catch {
    started = true;
    fail();
  }
})();
</script>
</body>
</html>
