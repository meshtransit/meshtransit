{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "meshcore.fullname" . }}
  labels:
    {{- include "meshcore.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "meshcore.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {{- with .Values.networkPolicy.controlIngressFrom }}
      from:
        {{- toYaml .Values.networkPolicy.controlIngressFrom | nindent 8 }}
      {{- end }}
      ports:
        - port: 8443
          protocol: TCP
    - from:
        {{- toYaml .Values.networkPolicy.operatorIngressFrom | nindent 8 }}
      ports:
        - port: 8081
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if .Values.networkPolicy.allowSameNamespaceStorage }}
    - to:
        - podSelector: {}
      ports:
        - port: 5432
          protocol: TCP
        - port: 6379
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
