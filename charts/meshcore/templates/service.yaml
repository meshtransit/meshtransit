{{- if or .Values.roles.all.enabled .Values.roles.control.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meshcore.fullname" . }}
  labels:
    {{- include "meshcore.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if and .Values.service.externalTrafficPolicy (or (eq .Values.service.type "LoadBalancer") (eq .Values.service.type "NodePort")) }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  sessionAffinity: {{ .Values.service.sessionAffinity }}
  ports:
    - name: control
      port: {{ .Values.service.port }}
      targetPort: control
      protocol: TCP
  selector:
    {{- include "meshcore.selectorLabels" . | nindent 4 }}
    meshtransit.io/control-serving: "true"
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meshcore.fullname" . }}-operator
  labels:
    {{- include "meshcore.labels" . | nindent 4 }}
  {{- with .Values.operatorService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: health
      port: 8081
      targetPort: health
      protocol: TCP
  selector:
    {{- include "meshcore.selectorLabels" . | nindent 4 }}
