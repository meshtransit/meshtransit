{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "meshcore.fullname" . }}-migration
  labels:
    {{- include "meshcore.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "meshcore.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "meshcore.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - migrate
            - up
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: MESHTRANSIT_MIGRATION_POSTGRES_ADDRESS
              value: {{ .Values.migration.postgres.address | quote }}
            - name: MESHTRANSIT_MIGRATION_POSTGRES_DATABASE
              value: {{ .Values.migration.postgres.database | quote }}
            - name: MESHTRANSIT_MIGRATION_POSTGRES_USER
              value: {{ .Values.migration.postgres.user | quote }}
            - name: MESHTRANSIT_MIGRATION_POSTGRES_PASSWORD_FILE
              value: /run/secrets/meshcore/postgres-password
            - name: MESHTRANSIT_MIGRATION_POSTGRES_CA_FILE
              value: /run/secrets/meshcore/postgres-ca.pem
            - name: MESHTRANSIT_MIGRATION_ACTOR
              value: {{ .Values.migration.actor | quote }}
            - name: MESHTRANSIT_MIGRATION_CONNECT_TIMEOUT
              value: {{ .Values.migration.connectTimeout | quote }}
            - name: MESHTRANSIT_MIGRATION_LOCK_TIMEOUT
              value: {{ .Values.migration.lockTimeout | quote }}
            - name: MESHTRANSIT_MIGRATION_STATEMENT_TIMEOUT
              value: {{ .Values.migration.statementTimeout | quote }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          volumeMounts:
            - name: migration-files
              mountPath: /run/secrets/meshcore
              readOnly: true
      volumes:
        - name: migration-files
          projected:
            defaultMode: 0440
            sources:
              - configMap:
                  name: {{ .Values.migration.postgres.caConfigMap }}
                  items:
                    - key: {{ .Values.migration.postgres.caKey }}
                      path: postgres-ca.pem
              - secret:
                  name: {{ .Values.migration.secretName }}
                  items:
                    - key: {{ .Values.migration.passwordKey }}
                      path: postgres-password
{{- end }}
