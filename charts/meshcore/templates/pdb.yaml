{{- if .Values.podDisruptionBudget.enabled }}
{{- range $role, $settings := .Values.roles }}
{{- if $settings.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "meshcore.roleFullname" (dict "root" $ "role" $role) }}
  labels:
    {{- include "meshcore.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  maxUnavailable: {{ $.Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "meshcore.roleSelectorLabels" (dict "root" $ "role" $role) | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
