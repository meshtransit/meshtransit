{{- range $role, $settings := .Values.roles }}
{{- if $settings.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "meshcore.roleFullname" (dict "root" $ "role" $role) }}-preflight
  labels:
    {{- include "meshcore.labels" $ | nindent 4 }}
    app.kubernetes.io/component: preflight
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "meshcore.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: preflight
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- with $.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: validate-{{ $role }}
          image: {{ include "meshcore.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args:
            - config
            - validate
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          env:
            {{- include "meshcore.runtimeEnv" (dict "root" $ "role" $role) | nindent 12 }}
          resources:
            {{- toYaml $.Values.migration.resources | nindent 12 }}
          {{- if ne $role "relay" }}
          volumeMounts:
            - name: runtime-files
              mountPath: /run/secrets/meshcore
              readOnly: true
          {{- end }}
      {{- if ne $role "relay" }}
      volumes:
        {{- include "meshcore.runtimeVolumes" (dict "root" $ "role" $role) | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
