{{- $splitEnabled := or .Values.roles.api.enabled .Values.roles.control.enabled .Values.roles.worker.enabled .Values.roles.relay.enabled -}}
{{- if and .Values.roles.all.enabled $splitEnabled -}}
{{- fail "roles.all cannot be enabled together with api, control, worker, or relay" -}}
{{- end -}}
{{- if not (or .Values.roles.all.enabled $splitEnabled) -}}
{{- fail "at least one MeshTransit runtime role must be enabled" -}}
{{- end -}}
{{- range $role, $settings := .Values.roles -}}
{{- if gt (int $settings.autoscaling.minReplicas) (int $settings.autoscaling.maxReplicas) -}}
{{- fail (printf "roles.%s.autoscaling.minReplicas cannot exceed maxReplicas" $role) -}}
{{- end -}}
{{- end -}}
