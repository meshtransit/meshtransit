{{- range $role, $settings := .Values.roles }}
{{- if $settings.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meshcore.roleFullname" (dict "root" $ "role" $role) }}
  labels:
    {{- include "meshcore.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  {{- if not $settings.autoscaling.enabled }}
  replicas: {{ $settings.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ $.Values.revisionHistoryLimit }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "meshcore.roleSelectorLabels" (dict "root" $ "role" $role) | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- toYaml $.Values.podAnnotations | nindent 8 }}
      labels:
        {{- include "meshcore.roleSelectorLabels" (dict "root" $ "role" $role) | nindent 8 }}
        meshtransit.io/control-serving: {{ or (eq $role "all") (eq $role "control") | quote }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      serviceAccountName: {{ include "meshcore.serviceAccountName" $ }}
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- with $.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: meshcore
          image: {{ include "meshcore.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args:
            - serve
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          env:
            {{- include "meshcore.runtimeEnv" (dict "root" $ "role" $role) | nindent 12 }}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
            {{- if or (eq $role "all") (eq $role "control") }}
            - name: control
              containerPort: 8443
              protocol: TCP
            {{- end }}
          startupProbe:
            httpGet:
              path: /live
              port: health
            failureThreshold: {{ $.Values.startupProbe.failureThreshold }}
            periodSeconds: {{ $.Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ $.Values.startupProbe.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: /live
              port: health
            failureThreshold: {{ $.Values.livenessProbe.failureThreshold }}
            periodSeconds: {{ $.Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ $.Values.livenessProbe.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            failureThreshold: {{ $.Values.readinessProbe.failureThreshold }}
            periodSeconds: {{ $.Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ $.Values.readinessProbe.timeoutSeconds }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          {{- if ne $role "relay" }}
          volumeMounts:
            - name: runtime-files
              mountPath: /run/secrets/meshcore
              readOnly: true
          {{- end }}
      {{- if ne $role "relay" }}
      volumes:
        {{- include "meshcore.runtimeVolumes" (dict "root" $ "role" $role) | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "meshcore.roleSelectorLabels" (dict "root" $ "role" $role) | nindent 14 }}
      {{- with $.Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
